name: Build & Deploy Enterprise Portfolio

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare dist & Run Python Pipeline
        run: |
          mkdir -p dist
          cp index.html sw.js dist/
          python3 scripts/generate_data.py
          python3 scripts/enterprise_ops.py
          cp -f sitemap.xml robots.txt manifest.json schema.json _headers build-telemetry.json dist/ 2>/dev/null || true

      - name: Compile TypeScript & SCSS into dist
        run: |
          npm install -g esbuild sass
          esbuild src/main.ts --bundle --minify --outfile=dist/main.js
          esbuild src/pwa-lang-addon.ts --bundle --minify --outfile=dist/pwa-lang-addon.js
          sass src/style.scss dist/style.css --style compressed --no-source-map


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
