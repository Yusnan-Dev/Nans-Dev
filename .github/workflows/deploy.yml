name: Build & Deploy Enterprise Portfolio

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Rust WASM Target
        run: |
          rustup target add wasm32-unknown-unknown

      - name: Prepare dist & Run Python + Go Pipeline
        run: |
          mkdir -p dist
          cp index.html sw.js dist/
          cp -f 404.html dist/ 2>/dev/null || true
          python3 scripts/generate_data.py
          python3 scripts/enterprise_ops.py
          go run scripts/edge_benchmark.go
          cp -rf images .well-known dist/ 2>/dev/null || true
          cp -f sitemap.xml robots.txt manifest.json icon-192.png icon-512.png schema.json _headers humans.txt build-telemetry.json dist/ 2>/dev/null || true
          
      - name: Compile Rust WebAssembly, TypeScript/TSX & SCSS into dist
        run: |
          rustc --target wasm32-unknown-unknown -O --crate-type=cdylib src/wasm/perf_engine.rs -o dist/perf_engine.wasm
          npm install -g esbuild sass
          esbuild src/main.ts --bundle --minify --jsx-factory=createDomNode --outfile=dist/main.js
          esbuild src/pwa-lang-addon.ts --bundle --minify --outfile=dist/pwa-lang-addon.js
          sass src/style.scss dist/style.css --style compressed --no-source-map

      - name: Setup Pages
        uses: actions/configure-pages@v5
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nans-dev
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
